services:
  # Database Service
  db:
    image: postgres:16-alpine
    container_name: compuroom-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-compuroom}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-compuroom}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - compuroom-net

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compuroom-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-compuroom}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - compuroom-net

  # Frontend Web UI Service (Vue 3 + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compuroom-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - compuroom-net

volumes:
  pgdata:
    driver: local

networks:
  compuroom-net:
    driver: bridge
