services:
  # Database Service
  db:
    image: postgres:16-alpine
    container_name: compuroom-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-compuroom}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-compuroom}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - compuroom-prod-net

  # Backend REST API Service (Pulled from Docker Hub)
  backend:
    image: ${DOCKERHUB_USER:-phirapat}/compuroom-api:v1.0.0
    container_name: compuroom-backend-prod
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-compuroom}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - compuroom-prod-net

  # Frontend Web UI Service (Pulled from Docker Hub)
  frontend:
    image: ${DOCKERHUB_USER:-phirapat}/compuroom-web:v1.0.0
    container_name: compuroom-frontend-prod
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - compuroom-prod-net

volumes:
  pgdata_prod:
    driver: local

networks:
  compuroom-prod-net:
    driver: bridge
