name: CI - compuroom

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Job 1: Code Quality & Linting
  lint:
    name: Code Quality (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

  # Job 2: Automated Unit & Integration Tests
  test:
    name: Automated Unit Tests (Jest & Supertest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Run Unit Tests (≥ 3 tests)
        working-directory: ./backend
        run: npm test

  # Job 3: Docker Images Build Verification
  build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t compuroom-api:test ./backend
          echo "Backend Docker Image built successfully."

      - name: Build Frontend Docker Image (Multi-stage)
        run: |
          docker build -t compuroom-web:test ./frontend
          echo "Frontend Docker Image built successfully."
